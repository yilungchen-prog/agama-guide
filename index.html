<style>
:root{
  /* 深夜藍的閱讀室：與書中圖解同一個世界，金色標示章節，青色標示連結與重點 */
  --bg:#0c1a2e; --panel:#11243d; --ink:#e7edf3; --muted:#9db0c4; --gold:#f2c46d; --cyan:#62d0ef; --line:#24405f;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17.5px;line-height:1.95;letter-spacing:.02em}
a{color:var(--cyan)}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
#bar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;z-index:30}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(12,26,46,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.top .name{font-family:var(--display);font-weight:900;font-size:clamp(20px,5.7vw,30px);letter-spacing:.02em;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
header.top .where{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
#tocbtn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.wrap{display:grid;grid-template-columns:1fr;max-width:1180px;margin:0 auto}
aside{position:fixed;inset:0 auto 0 0;width:min(340px,86vw);background:var(--panel);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .25s;z-index:40;overflow-y:auto;padding:20px 18px 40px}
aside.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;display:none}
#scrim.open{display:block}
aside h2{font-family:var(--display);font-size:18px;color:var(--gold);margin:0 0 12px}
aside ol{list-style:none;margin:0;padding:0}
aside li{margin:0}
aside a{display:block;text-decoration:none;color:var(--ink);font-size:14.5px;line-height:1.5;padding:6px 8px;border-radius:6px}
aside a:hover{background:rgba(98,208,239,.08)}
aside a.tc{font-weight:700;margin-top:10px}
aside a.tc span{display:block;font-size:12px;color:var(--gold);font-weight:500;letter-spacing:.1em}
aside ol ol a{color:var(--muted);font-size:13.5px;padding-left:16px}
aside a.here{background:rgba(242,196,109,.12);color:var(--gold)}
@media (min-width:1100px){
  .wrap{grid-template-columns:300px 1fr;gap:48px}
  aside{position:sticky;top:57px;height:calc(100vh - 57px);transform:none;width:auto;border:none;border-right:1px solid var(--line);background:transparent}
  #tocbtn,#scrim{display:none!important}
}
main{padding:0 18px 80px;min-width:0}
.hero{max-width:40rem;margin:0 auto;padding:48px 0 28px;border-bottom:1px solid var(--line)}
.hero .kicker{color:var(--cyan);font-size:14px;letter-spacing:.2em}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,44px);line-height:1.3;margin:10px 0 12px;text-wrap:wrap}
.hero p{color:var(--muted);margin:0 0 6px}
.hero .note{font-size:14px;margin-top:16px;padding:10px 14px;border-left:3px solid var(--gold);background:var(--panel);border-radius:0 8px 8px 0}
.chapter{max-width:40rem;margin:0 auto;padding-top:40px}
.chapter h1{font-family:var(--display);font-weight:900;font-size:clamp(25px,4.6vw,32px);line-height:1.45;margin:24px 0 18px;text-wrap:wrap}
.ch-label{display:inline-block;font-family:var(--body);font-size:14px;font-weight:700;color:var(--bg);background:var(--gold);padding:2px 12px;border-radius:999px;letter-spacing:.15em;margin-bottom:6px}
.chapter h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.5;color:var(--gold);margin:44px 0 12px;padding-top:4px;text-wrap:wrap}
.chapter h3{font-size:18px;font-weight:700;color:var(--cyan);margin:30px 0 8px;line-height:1.6}
p{margin:0 0 1em}
strong{color:#fff;font-weight:700}
em{color:var(--muted)}
figure{margin:14px -4px 22px;padding:0}
figure img{display:block;width:100%;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
ul,ol{padding-left:1.4em;margin:0 0 1em}
li{margin:.35em 0}
li>p{margin:0 0 .4em}
blockquote{margin:1em 0;padding:8px 16px;border-left:3px solid var(--cyan);background:var(--panel);border-radius:0 8px 8px 0}
.chapnav{margin:48px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.chapnav a{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;color:var(--ink);font-family:var(--display);font-weight:600;line-height:1.5}
.chapnav a:hover{border-color:var(--gold)}
.chapnav small{display:block;font-family:var(--body);font-weight:500;color:var(--gold);font-size:13px;letter-spacing:.1em}
footer{max-width:40rem;margin:60px auto 0;color:var(--muted);font-size:13px;text-align:center}

html,body{overflow-x:clip}
html{scroll-padding-top:118px}
body{font-size:18px}
.tabs{position:sticky;top:57px;z-index:19;display:flex;gap:8px;overflow-x:auto;padding:9px 16px;background:rgba(12,26,46,.96);border-bottom:1px solid var(--line);scrollbar-width:none;overscroll-behavior-x:contain}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;text-decoration:none;color:var(--muted);font-size:15px;font-weight:700;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);line-height:1.6}
.tab.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
@media (min-width:1100px){aside{top:110px;height:calc(100vh - 110px)}.tabs{justify-content:center}}
.chapter[hidden]{display:none}
.chapter h1{font-size:clamp(30px,7.6vw,42px);line-height:1.4}
.ch-label{font-size:16px;padding:3px 14px}
.chapter h2{font-size:clamp(24px,6vw,28px);line-height:1.45;margin:52px 0 14px;padding-left:14px;position:relative}
.chapter h2::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:5px;background:var(--gold);transform-origin:top;transform:scaleY(0);transition:transform .7s ease-out}
.chapter h2.in::before,.noio .chapter h2::before{transform:none}
@media (prefers-reduced-motion:reduce){.chapter h2::before{transform:none;transition:none}}
.chapter h3{font-size:clamp(20px,5.2vw,22px)}
figure{margin:16px -18px 26px;position:relative;cursor:zoom-in}
figure img{border-radius:0;border-left:none;border-right:none}
figure::after{content:"點圖放大";position:absolute;right:10px;bottom:10px;font-size:12px;color:var(--ink);background:rgba(12,26,46,.8);border:1px solid var(--line);padding:2px 8px;border-radius:999px;pointer-events:none}
@media (min-width:700px){figure{margin:18px -40px 28px}figure img{border-radius:12px;border:1px solid var(--line)}}
#lb{position:fixed;inset:0;z-index:60;background:rgba(5,12,22,.97);display:none;flex-direction:column}
#lb.open{display:flex}
#lb .lb-bar{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:10px 14px;color:var(--muted);font-size:13px}
#lb .lb-bar span{flex:1}
#lb button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
#lb .lb-view{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
#lb img{width:100%;height:auto;max-height:100%;object-fit:contain}
#lb.big .lb-view{display:block}
#lb.big img{width:1200px;max-width:none;max-height:none}
.chapnav{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.chapnav a.prev{font-size:15px}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:8px 0 24px}
.flow-start{align-self:center;border:1px dashed var(--muted);color:var(--muted);border-radius:999px;padding:4px 18px;font-size:15px}
.flow-step{align-self:center;color:var(--cyan);font-size:14px;font-weight:700;padding:6px 0 6px 18px;position:relative}
.flow-step::before{content:"";position:absolute;left:0;top:4px;bottom:4px;border-left:2px solid var(--cyan)}
.flow-step::after{content:" ▼";color:var(--cyan)}
.flow-card,.dg-l,.dg-out{background:var(--panel);border:1.5px solid var(--cyan);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.fc-ch,.dg-l span{font-size:13px;color:var(--cyan);font-weight:700;letter-spacing:.1em}
.flow-card b,.dg-l b,.dg-out b{font-size:19px;font-family:var(--display);color:#fff}
.fc-d,.dg-l i,.dg-out i{font-style:normal;font-size:15.5px;color:var(--muted);line-height:1.6}
.dg{margin:16px 0 26px;padding:18px 16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#132b4a,#0e2038)}
.dg-title{font-family:var(--display);font-weight:900;font-size:21px;border-left:5px solid var(--gold);padding-left:12px;margin-bottom:14px}
.dg-layers{display:flex;flex-direction:column;gap:10px}
.dg-l.gold,.dg-out{border-color:var(--gold)}.dg-l.gold span{color:var(--gold)}
.dg-arrow{text-align:center;color:var(--gold);font-size:22px;line-height:1.6}
.dg-out{text-align:center;align-items:center}.dg-out b{color:var(--gold)}
.dg-foot{text-align:center;color:var(--cyan);font-weight:700;font-size:15.5px;margin-top:14px;line-height:1.7}
.dg-foot small{color:var(--muted);font-weight:400;font-size:13px}

/* 名詞小卡、經文連結、章節跳轉、返回、互動演練 */
.term{color:inherit;text-decoration:underline dotted var(--cyan);text-decoration-thickness:2px;text-underline-offset:5px;cursor:pointer;background:none;border:none;padding:0;font:inherit;letter-spacing:inherit}
.term:hover{color:var(--cyan)}
a.xref{color:var(--cyan);text-decoration:none;border-bottom:1px solid rgba(98,208,239,.45)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--panel);border-top:2px solid var(--gold);border-radius:16px 16px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s;box-shadow:0 -10px 30px rgba(0,0,0,.4);max-width:640px;margin:0 auto}
#sheet.open{transform:none}
#sheet .sh-term{font-family:var(--display);font-weight:900;font-size:24px;color:var(--gold)}
#sheet .sh-pali{font-size:14px;color:var(--muted);margin-left:8px;font-family:var(--body);font-weight:400}
#sheet p{margin:8px 0 14px;font-size:17px;line-height:1.85}
#sheet .sh-act{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font:inherit;font-size:15px;cursor:pointer;text-decoration:none;line-height:1.5}
.btn.pri{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700}
#back{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;display:none;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#back.show{display:block}
.drill{margin:28px -6px 30px;padding:18px 16px 20px;border:1.5px solid var(--gold);border-radius:16px;background:linear-gradient(180deg,#14304f,#0f2239)}
.drill h4{margin:0 0 4px;font-family:var(--display);font-size:21px;color:var(--gold)}
.drill .d-intro{font-size:15.5px;color:var(--muted);margin:0 0 12px;line-height:1.75}
.d-scen{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.d-scen button{font-size:14.5px}
.d-scen button.on{background:var(--cyan);color:var(--bg);border-color:var(--cyan);font-weight:700}
.d-chain{display:flex;flex-wrap:nowrap;gap:3px;align-items:center;margin:4px 0 14px}
.d-node{width:36px;height:36px;flex:none;border-radius:10px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;color:var(--muted);transition:all .25s}
.d-node.lit{border-color:var(--cyan);color:#fff;background:rgba(98,208,239,.15)}
.d-node.hot{border-color:#ff8a7a;color:#fff;background:rgba(255,138,122,.18)}
.d-node.cut{opacity:.3;text-decoration:line-through}
.d-sep{color:var(--muted);font-size:13px}
.d-sep.scissor{color:var(--gold);font-size:18px}
.d-step{background:rgba(12,26,46,.6);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:16.5px;line-height:1.8}
.d-step b.k{color:var(--cyan);margin-right:6px}
.d-step.bad{border-color:rgba(255,138,122,.6)}.d-step.bad b.k{color:#ff8a7a}
.d-step.good{border-color:var(--gold)}.d-step.good b.k{color:var(--gold)}
.d-q{margin:10px 0 2px;font-weight:700}
.d-opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.d-opts .btn{text-align:left}
.d-msg{font-size:15px;color:#ff8a7a;margin-top:6px}
.d-again{margin-top:12px}
#loadmsg{max-width:40rem;margin:60px auto;color:var(--muted);text-align:center}

/* ===== 圖解元件（行動版優先：一律上下排列，寬螢幕才橫排） ===== */
.dgm{margin:22px -6px 30px;padding:18px 14px 20px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#132b4a,#0e2038);display:flex;flex-direction:column;gap:12px}
.t-cyan{--c:var(--cyan)}.t-gold{--c:var(--gold)}.t-red{--c:#ff8a7a}.t-muted{--c:#8297ae}
.g-head{margin-bottom:2px}
.g-title{font-family:var(--display);font-weight:900;font-size:21px;line-height:1.45;border-left:5px solid var(--gold);padding-left:12px;text-wrap:wrap}
.g-sub{font-size:14px;color:var(--cyan);padding-left:17px;margin-top:2px}
.g-card{display:flex;flex-direction:column;gap:3px;border:1.5px solid var(--c);border-radius:12px;padding:12px 14px;background:rgba(12,26,46,.72);color:var(--ink);text-decoration:none;min-width:0}
a.g-card:hover{box-shadow:0 0 0 2px var(--c)}
.g-h{font-family:var(--display);font-weight:900;font-size:18.5px;color:var(--c);line-height:1.45}
.g-k{font-size:13px;font-weight:700;color:var(--c);letter-spacing:.12em}
.g-en{font-style:italic;font-size:13px;color:var(--cyan)}
.g-s{font-size:15px;color:#fff;font-weight:700}
.g-d,.g-lines,.g-seq{font-size:15.5px;color:#c9d6e3;line-height:1.7}
.g-lines,.g-seq{display:flex;flex-direction:column}
.g-seq em{font-style:normal;color:var(--c);text-align:left;line-height:1.3;padding-left:6px}
.g-use{font-size:15px;color:#fff;margin-top:4px;padding-top:6px;border-top:1px dashed var(--line)}
.g-use small{display:block;font-size:12px;color:var(--muted)}
.g-badge{width:48px;height:48px;border-radius:50%;border:2px solid var(--c);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:19px;color:var(--c);box-shadow:0 0 12px rgba(242,196,109,.25);flex:none;margin-bottom:4px}
.has-badge{align-items:center;text-align:center}
.g-boxed{text-align:center;align-items:center;background:rgba(242,196,109,.07)}
.g-cmp{display:flex;flex-direction:column;gap:6px}
.g-via{display:flex;flex-direction:column;align-items:center;gap:0;color:var(--gold);font-size:14px}
.g-via .g-arrow{font-size:22px;transform:rotate(90deg);line-height:1.2}
.g-via small{color:var(--muted);font-size:12.5px}
.g-cols{display:grid;grid-template-columns:1fr;gap:10px}
.g-plusmark{text-align:center;font-size:24px;color:#fff;line-height:1}
.g-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.g-grid.n3 .g-card:not(.has-badge){grid-column:auto}
.g-steps{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.g-step-arrow{display:block;text-align:center;color:var(--gold);font-size:14px;line-height:1}
.g-step-arrow::before{content:"▼"}
.g-map{display:flex;flex-direction:column;gap:8px}
.g-maprow{display:grid;grid-template-columns:1fr auto 84px;align-items:center;gap:6px}
.g-maprow .g-step-arrow::before{content:"▶"}
.g-mapto{align-items:center;justify-content:center;text-align:center;height:100%}
.g-vflow{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.g-down{text-align:center;color:var(--cyan);font-size:12px;line-height:1.2}
.g-row{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:baseline}
.g-row .g-k{grid-row:span 2;align-self:center;min-width:3.2em}
.g-row .g-d{grid-column:2}
.g-hub{display:flex;flex-direction:column;gap:6px}
.g-hubitems{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.g-hubc{align-self:center;text-align:center;border:2px solid var(--gold);border-radius:999px;padding:10px 26px;background:rgba(242,196,109,.08);box-shadow:0 0 16px rgba(242,196,109,.25);display:flex;flex-direction:column}
.g-hubc b{font-family:var(--display);font-size:20px;color:var(--gold)}
.g-hubc span{font-size:14px;color:var(--cyan)}
.g-cycle{display:flex;flex-direction:column;gap:10px}
.g-cyc{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;counter-reset:cy}
.g-cyc li{margin:0;counter-increment:cy;position:relative;display:flex}
.g-cyc li>.g-card{flex:1}
.g-cyc li .g-card{padding-left:36px}
.g-cyc li::before{content:counter(cy);position:absolute;left:10px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:1}
.g-back{text-align:center;color:var(--cyan);font-size:14px}
.g-chain{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;justify-content:center}
.g-chip{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--c);color:var(--c);border-radius:10px;padding:5px 11px;font-family:var(--display);font-weight:900;font-size:16.5px;background:rgba(12,26,46,.7)}
.g-chain .t-gold{box-shadow:0 0 10px rgba(242,196,109,.35)}
.g-sep{color:var(--muted);font-size:13px}
.g-pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g-pair{display:flex;align-items:center;gap:6px;justify-content:center}
.g-gates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g-gate{display:flex;flex-direction:column;align-items:center;gap:6px}
.g-guard{width:32px;height:32px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.g-dots{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column;gap:14px;position:relative}
.g-dots::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;border-left:2px dotted rgba(98,208,239,.5)}
.g-dots li{display:flex;gap:14px;align-items:center;margin:0;position:relative}
.g-dot{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid var(--gold);background:var(--bg);color:var(--gold);font-family:var(--display);font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(242,196,109,.3)}
.g-dots li>div>b,.g-checks li>div>b{display:block;font-size:17px;color:#fff}
.g-dots li>div>span,.g-checks li>div>span{display:block;font-size:15.5px;color:#c9d6e3;line-height:1.6}
.g-checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.g-checks li{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;margin:0;background:rgba(12,26,46,.72)}
.g-box{width:22px;height:22px;flex:none;border:2px solid var(--gold);border-radius:6px;margin-top:3px}
.g-banner{border:1.5px solid var(--c);color:var(--c);border-radius:999px;padding:8px 16px;text-align:center;font-weight:700;font-size:15.5px;line-height:1.6;background:rgba(255,255,255,.03)}
.g-label{font-size:14px;font-weight:700;color:var(--c);letter-spacing:.08em;margin-bottom:-4px}
.kw{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 22px}
.kw-h{font-size:13px;color:var(--muted);letter-spacing:.1em;margin-right:2px}
.kw .kw-chip{text-decoration:none;border:1px solid rgba(98,208,239,.45);background:rgba(98,208,239,.08);color:var(--cyan);border-radius:999px;padding:4px 12px;font-size:14.5px;line-height:1.4}
.kw .kw-chip:hover{background:rgba(98,208,239,.18)}
.dict-btn{color:var(--gold)}
.dsearch{position:sticky;top:var(--dq-top,0);margin:6px 0 18px}
.dsearch input{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid rgba(242,196,109,.45);border-radius:12px;color:var(--ink);font:inherit;font-size:16px;padding:11px 14px}
.dsearch input:focus{outline:none;border-color:var(--gold)}
.dsearch{display:flex;gap:8px}
.dsearch input{flex:1;min-width:0}
.dsearch button{flex:none;background:var(--gold);color:#1a1205;border:0;border-radius:12px;font:inherit;font-size:16px;font-weight:700;padding:0 18px;cursor:pointer}
.dq-sum{margin:-8px 0 16px;color:var(--muted);font-size:14px}
mark.hit{background:var(--gold);color:#1a1205;font-weight:700;border-radius:4px;padding:0 2px}
.dsearch .dq-x{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.18);padding:0 14px;font-weight:400}
.chres{margin:0 0 22px}
.chres-h{font-size:17px;color:var(--gold);margin:0 0 10px}
.chres-item{display:block;background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 14px;margin:0 0 8px;color:var(--ink);text-decoration:none}
.chres-t{font-weight:700;font-size:15px;color:var(--cyan,#62d0ef);margin-bottom:4px}
.chres-s{font-size:15px;line-height:1.7;margin:2px 0;color:var(--ink)}
.chres-n{font-size:13px;color:var(--muted)}
.find-flash{animation:findflash 2.4s ease-out 1}
@keyframes findflash{0%,40%{background:rgba(242,196,109,.18);box-shadow:0 0 0 6px rgba(242,196,109,.18)}100%{background:transparent;box-shadow:none}}
.dcats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.dcat{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--muted);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.dcat.on{background:var(--gold);border-color:var(--gold);color:#1a1205;font-weight:700}
.ditem{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.dterm{font-family:var(--display);font-weight:900;font-size:20px;color:var(--gold);display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.dpali{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.dcatl{margin-left:auto;font-family:var(--body);font-weight:500;font-size:12px;color:var(--cyan);border:1px solid rgba(98,208,239,.35);border-radius:999px;padding:1px 8px}
.ddef{margin:6px 0 8px!important;font-size:16px;line-height:1.8}
.dwhere{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dwl{font-size:12.5px;color:var(--muted);margin:0 2px 0 4px}
.dwhere a{font-size:13px;text-decoration:none;border-radius:999px;padding:2px 9px;border:1px solid rgba(98,208,239,.35);color:var(--cyan)}
.dwhere a.dsee{background:var(--gold);border-color:var(--gold);color:#1a1205;font-weight:700}
.dict-none,.qa-none{color:var(--muted)}
.qa-cat{font-size:13px;letter-spacing:.15em;color:var(--gold);margin:18px 0 8px}
.qa{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:12px;margin:0 0 10px;padding:0 14px}
.qa summary{cursor:pointer;font-weight:700;font-size:17px;line-height:1.6;padding:12px 0;list-style:none;display:flex;gap:10px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:"問";flex:none;display:inline-grid;place-items:center;width:24px;height:24px;margin-top:2px;border-radius:50%;background:var(--gold);color:#1a1205;font-size:13px}
.qa[open] summary{color:var(--gold)}
.qa-a{padding:0 0 10px;border-top:1px dashed rgba(242,196,109,.3)}
.qa-a p{font-size:16px;line-height:1.85}
.story{margin:26px 0;padding:16px 16px 12px;border:1px solid rgba(242,196,109,.45);border-radius:14px;background:linear-gradient(160deg,rgba(242,196,109,.10),rgba(17,36,61,.6))}
.story-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.story-tag{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#1a1205;font-size:12.5px;font-weight:700;letter-spacing:.1em;padding:3px 10px;border-radius:999px}
.story-tag svg{width:14px;height:14px}
.story-t{font-family:var(--display);font-size:19px;font-weight:700;color:var(--gold);line-height:1.4}
.story p{margin:8px 0}
.story .story-k{color:var(--cyan);font-weight:700}
.rd{margin:30px 0 0;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.08)}
.rd-t{font-size:13px;letter-spacing:.15em;color:var(--gold);margin-bottom:6px}
.rd-b{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;text-decoration:none;color:var(--ink);padding:6px 0;border-top:1px dashed rgba(255,255,255,.1)}
.rd-b:first-of-type{border-top:none}
.rd-b span{font-size:13px;color:var(--muted)}
.book{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.book-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.book-h b{font-family:var(--display);font-size:18px;color:var(--gold)}
.book-lv{font-size:12px;color:var(--cyan);border:1px solid rgba(98,208,239,.35);border-radius:999px;padding:1px 8px}
.book-a{font-size:14px;color:var(--muted);margin-top:2px}
.book p{font-size:15.5px;line-height:1.8;margin:6px 0}
.book-tip span{display:inline-block;font-size:12px;font-weight:700;color:#1a1205;background:var(--gold);border-radius:999px;padding:0 8px;margin-right:6px}
.pr{margin:22px 0 0;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.pr span{flex-basis:100%}
.pr span{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.lic{display:inline-block;margin-top:6px;font-size:12.5px;line-height:1.7}
.lic a{color:var(--cyan)}
.offline-tip{font-size:13.5px;color:var(--muted);margin:14px auto 0;max-width:30em;line-height:1.7}
.mini{margin:18px auto;max-width:360px;padding:8px 6px 4px;border:1px solid var(--line);border-radius:14px;background:rgba(17,36,61,.6)}
.mini::after{display:none}
.mini svg{display:block;width:100%;height:auto;font-family:var(--body,inherit)}
.mini svg{overflow:hidden}
#bar{background:linear-gradient(90deg,rgba(242,196,109,.35),var(--gold))}
#bar::after{content:"";position:absolute;right:-4px;top:-2.5px;width:8px;height:8px;border-radius:50%;background:#fff3c4;box-shadow:0 0 8px 3px rgba(242,196,109,.8);animation:barglow 2s ease-in-out infinite}
@keyframes barglow{50%{box-shadow:0 0 4px 1px rgba(242,196,109,.5)}}
.chapter h1{position:relative;overflow:hidden}
.chapter h1.shine::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:35%;background:linear-gradient(100deg,transparent,rgba(255,240,200,.35),transparent);transform:skewX(-18deg);animation:shine 1.4s ease-out .2s 1 forwards;pointer-events:none}
@keyframes shine{to{left:120%}}
.done{text-align:center;margin:36px 0 0;color:var(--gold);font-family:var(--display);font-size:17px;font-weight:600}
.done svg{display:block;width:84px;height:60px;margin:0 auto 6px}
.done .pt{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .7s cubic-bezier(.3,1.5,.6,1)}
.done.in .pt{transform:none}
.done .p2{transition-delay:.15s}.done .p3{transition-delay:.3s}
.done span{opacity:0;transition:opacity .6s .6s}.done.in span{opacity:1}
.home .done,.home h2::before{display:none}
@media (prefers-reduced-motion:reduce){#bar::after{animation:none}.chapter h1.shine::after{display:none}.done .pt{transform:none;transition:none}.done span{opacity:1}}
.deep{margin:32px 0 0;padding:16px;border:1px solid rgba(242,196,109,.5);border-radius:14px;background:rgba(242,196,109,.07)}
.deep-t{font-family:var(--display);font-weight:700;color:var(--gold);font-size:18px;margin-bottom:8px}
.deep-b{display:block;text-decoration:none;color:var(--ink);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-top:8px}
.deep-b span{display:block;font-size:13px;color:var(--gold);letter-spacing:.08em}
.deep-b b{font-family:var(--display);font-weight:600;line-height:1.5}
.story.def{border-color:rgba(207,216,227,.45);background:linear-gradient(160deg,rgba(207,216,227,.08),rgba(17,36,61,.6))}
.story.def .story-tag{background:#cfd8e3;color:#0c1a2e}
.story.def .story-t{color:#e7edf3}
.story.def ul{margin:6px 0 6px 1.2em;padding:0}.story.def li{margin:5px 0;line-height:1.8}
.share{margin:28px 0 0;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-align:center}
.share-t{font-family:var(--display);font-weight:700;color:var(--gold);font-size:17px;margin-bottom:10px}
.share .btn{margin:4px 2px}
.share-line{background:#06c755!important;border-color:#06c755!important;color:#fff!important}
.share-msg{display:block;font-size:13px;color:var(--cyan);min-height:1.2em;margin-top:4px}
.home .share{display:none}
@media print{
 :root{--bg:#fff;--panel:#fff;--ink:#111;--muted:#444;--gold:#7a5200;--cyan:#0b5f7a;--line:#bbb}
 html,body{background:#fff!important;color:#111!important}
 .topbar,#bar,#scrim,#toc,#sheet,#back,#lb,.upd,.mini,.done,.deep,.share,.kw,.drill,.fb,.rd,.pr,.chapnav,footer,.dsearch,.dcats{display:none!important}
 .wrap,main{display:block!important;margin:0!important;padding:0!important;max-width:none!important}
 section.chapter[hidden]{display:none!important}
 .story,.stance,.ditem,.book,.qa,.g-card,.dgm,.part-intro,.tier{background:#fff!important;box-shadow:none!important;border-color:#bbb!important}
 h1,h2,h3,p,li{color:#111!important}
 h2{break-after:avoid}
 .chapter h2::before{transform:none!important}
 section.chapter+section.chapter{break-before:page}
 .story,.dgm,.book,.ditem{break-inside:avoid}
 .term{text-decoration:none!important}
 details.qa>*{display:block!important}
 a{color:inherit!important}
}
.fb{margin:34px 0 10px;padding:16px;border:1px dashed rgba(242,196,109,.5);border-radius:14px;text-align:center}
.fb-t{font-family:var(--display);font-weight:900;font-size:19px;color:var(--gold)}
.fb p{font-size:15px;color:var(--muted);margin:8px 0 12px}
.story.exp{border-color:rgba(156,214,140,.5);background:linear-gradient(160deg,rgba(156,214,140,.10),rgba(17,36,61,.6))}
.story.exp .story-tag{background:#9cd68c;color:#10230b}
.story.exp .story-t{color:#b5e3a8}
.story.exp ol{margin:6px 0 6px 1.2em;padding:0}
.story.exp li{margin:4px 0;line-height:1.8}
.story-src a{color:var(--cyan)}
.story.nav{border-color:rgba(185,163,255,.5);background:linear-gradient(160deg,rgba(185,163,255,.10),rgba(17,36,61,.6))}
.story.nav .story-tag{background:#b9a3ff;color:#1b1233}
.story.nav .story-t{color:#cdbcff}
.story.sci{border-color:rgba(98,208,239,.45);background:linear-gradient(160deg,rgba(98,208,239,.10),rgba(17,36,61,.6))}
.story.sci .story-tag{background:var(--cyan);color:#06202b}
.story.sci .story-t{color:var(--cyan)}
.story.sci .story-k{color:var(--gold)}
.stance{margin:18px 0 26px;padding:16px;border:1px solid rgba(242,196,109,.5);border-radius:14px;background:rgba(242,196,109,.07)}
.stance-h{font-family:var(--display);font-weight:900;font-size:20px;color:var(--gold);margin-bottom:6px}
.tiers{display:grid;gap:8px;margin:10px 0}
.tier{border-radius:10px;padding:9px 12px;background:var(--panel);border-left:4px solid var(--c)}
.tier b{display:block;color:var(--c);font-size:15.5px}
.tier span{font-size:14.5px;line-height:1.7;color:var(--ink)}
.tier.t1{--c:var(--cyan)}.tier.t2{--c:var(--gold)}.tier.t3{--c:#9aa7b8}
.story-src{font-size:12.5px;color:var(--muted);border-top:1px dashed rgba(242,196,109,.3);padding-top:8px;margin-top:10px!important}
.upd{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--gold);color:#1a1205;font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.g-note{text-align:center;font-weight:700;font-size:16px;color:var(--c);line-height:1.7;text-wrap:wrap}
.g-src{text-align:center;font-size:14px;color:var(--muted)}
.g-small{text-align:center;font-size:13px;color:var(--muted)}
.g-quote{margin:0;text-align:center;font-family:var(--display);font-size:19px;background:none;border:none;color:#fff}
.g-next{display:flex;justify-content:center;gap:8px;border:1.5px solid var(--cyan);border-radius:999px;padding:9px 16px;color:var(--cyan);font-weight:700;text-decoration:none;font-size:15.5px;text-align:center;background:rgba(98,208,239,.06)}
.g-lotus{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.g-lotus svg{width:190px;height:auto;filter:drop-shadow(0 0 10px rgba(242,196,109,.35))}
.g-lotus b{font-family:var(--display);font-size:21px;color:#fff;text-wrap:wrap}
.g-lotus span{color:var(--gold);font-size:15.5px}
@media (min-width:640px){
  .dgm{margin:24px -24px 32px;padding:22px 22px 24px}
  .g-cmp{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:12px}
  .g-via{justify-content:center}.g-via .g-arrow{transform:none}
  .g-cols{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .g-cols.g-plus{grid-template-columns:1fr auto 1fr;align-items:center}
  .g-steps.n2,.g-steps.n3,.g-steps.n4{flex-direction:row;align-items:stretch}
  .g-steps.n2>.g-card,.g-steps.n3>.g-card,.g-steps.n4>.g-card{flex:1}
  .g-steps.n2 .g-step-arrow,.g-steps.n3 .g-step-arrow,.g-steps.n4 .g-step-arrow{align-self:center}
  .g-steps.n2 .g-step-arrow::before,.g-steps.n3 .g-step-arrow::before,.g-steps.n4 .g-step-arrow::before{content:"▶"}
  .g-gates{grid-template-columns:repeat(6,1fr)}
  .g-pairs{grid-template-columns:repeat(3,1fr)}
}

/* 篇別、標籤、選擇題演練 */
.tab-part{flex:none;align-self:center;font-size:12px;color:var(--gold);letter-spacing:.15em;padding:0 2px 0 8px;border-left:1px solid var(--line);margin-left:4px}
aside li.toc-part{font-size:12px;color:var(--cyan);letter-spacing:.2em;margin:18px 8px 0;padding-top:10px;border-top:1px solid var(--line)}
aside li.toc-part:first-child{border-top:none;margin-top:0;padding-top:0}
.part-intro{color:var(--muted);font-size:15.5px;border-left:3px solid var(--cyan);padding:6px 12px;background:var(--panel);border-radius:0 8px 8px 0}
.lab-list{list-style:none;padding-left:0;display:flex;flex-direction:column;gap:10px}
.lab-list>li.lab{margin:0;padding:12px 14px 12px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:0 12px 12px 0;background:rgba(17,36,61,.75)}
.lab-list>li:not(.lab){margin-left:1.4em}
li.lab>p{margin:0}
.lab-badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:2px 12px 2px 8px;margin-bottom:6px;line-height:1.6;background:rgba(12,26,46,.6)}
li.lab>.lab-badge{display:flex;width:max-content;max-width:100%}
.lab-badge svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lab-num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--c);color:var(--bg);font-size:12px}
p.lab-p{padding:12px 14px;border-left:3px solid var(--c);background:rgba(17,36,61,.75);border-radius:0 12px 12px 0}
p.lab-p>.lab-badge{display:flex;width:max-content;margin-bottom:6px}
.d-opts .btn.right{border-color:var(--gold);background:rgba(242,196,109,.15)}
.d-opts .btn.wrong{border-color:#ff8a7a;background:rgba(255,138,122,.12)}
.g-triples{display:flex;flex-direction:column;gap:6px}
.g-trow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g-trow .g-chip{font-size:15px;padding:5px 4px}
.g-thead span{text-align:center;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.2em}

/* 首頁按鈕與首頁 */
header.top{gap:10px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--gold);padding:5px 12px 5px 8px;border-radius:12px;border:1px solid rgba(242,196,109,.55);background:linear-gradient(135deg,rgba(242,196,109,.22),rgba(98,208,239,.08));box-shadow:0 0 14px rgba(242,196,109,.15)}
.brand:hover{border-color:var(--gold)}
.brand .name{flex:1;min-width:0;font-size:clamp(17px,4.9vw,26px)!important;line-height:1.15}
.brand .name-sub{display:block;font-family:var(--body);font-weight:700;font-size:clamp(13px,4vw,17px);letter-spacing:.12em;color:var(--cyan);margin-top:3px;white-space:nowrap}
.cover-sub2{display:block;font-size:.5em;letter-spacing:.3em;color:var(--gold);margin-top:6px}
.brand-lotus{width:30px;height:auto;flex:none}
.home .cover{text-align:center;padding:40px 8px 30px;border-bottom:1px solid var(--line);margin-bottom:10px}
.cover-lotus{width:130px;height:auto;color:var(--gold);filter:drop-shadow(0 0 14px rgba(242,196,109,.4))}
.home .cover h1{font-family:var(--display);font-weight:900;font-size:clamp(32px,9vw,48px);line-height:1.3;margin:12px 0 8px;color:#fff}
.cover-sub{color:var(--cyan);font-size:16px;margin:0 0 20px}
.cover-act{display:flex;flex-direction:column;align-items:center;gap:10px}
.cover-act .btn{font-size:17px;padding:10px 26px}
.home-part h2{font-family:var(--display);font-size:24px;color:var(--gold);margin:30px 0 4px;padding-left:12px;border-left:5px solid var(--gold)}
.home-desc{color:var(--muted);font-size:15px;margin:0 0 12px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.home-card{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.home-card:hover{border-color:var(--gold)}
.home-card span{font-size:12.5px;color:var(--gold);font-weight:700;letter-spacing:.1em}
.home-card b{font-family:var(--display);font-size:17px;line-height:1.45}
.home-card i{font-style:normal;font-size:13.5px;color:var(--muted);line-height:1.5}
.home .chapnav{display:none}

/* 兩層導覽：篇 → 主題 */
.topbar{position:sticky;top:0;z-index:20;background:rgba(12,26,46,.96);backdrop-filter:blur(6px)}
.topbar header.top{position:static;background:none}
.parts{display:flex;gap:2px;padding:6px 6px 0;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.parts::-webkit-scrollbar{display:none}
.part-btn{flex:1 0 auto;display:flex;align-items:center;justify-content:center;min-height:46px;min-width:52px;text-align:center;text-decoration:none;font:inherit;font-size:16.5px;font-weight:700;color:var(--muted);background:none;border:none;border-bottom:3px solid transparent;padding:4px 7px 3px;cursor:pointer}
@media (max-width:380px){.part-btn{font-size:15.5px;padding:4px 5px 3px;min-width:46px}}
.part-btn.on{color:var(--gold);border-bottom-color:var(--gold)}
.topbar .tabs{position:static;border-top:1px solid var(--line);padding:8px 16px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3;padding:7px 16px 8px;border-radius:12px;min-height:52px}
.tab[hidden]{display:none}
.tab small{font-size:12.5px;font-weight:500;opacity:.85;letter-spacing:.05em}
.tab b{font-size:17.5px;white-space:nowrap}
html{scroll-padding-top:222px}
@media (max-width:600px){header.top .where{display:none}}
@media (min-width:1100px){aside{top:150px;height:calc(100vh - 150px)}}
blockquote.gatha{font-family:var(--display);font-size:clamp(22px,6vw,28px);line-height:1.8;text-align:center;color:var(--gold);border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;background:none;padding:14px 8px;margin:14px 0 18px}
</style>
</head>
<body id="top">
<div id="bar"></div>
<div class="topbar">
<header class="top">
  <button id="tocbtn" type="button" aria-controls="toc" aria-expanded="false">目錄</button>
  <a class="brand" href="#home" aria-label="回到首頁"><svg class="brand-lotus" viewBox="0 0 64 40" aria-hidden="true"><g fill="rgba(242,196,109,.25)" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M32 34C22 28 12 26 4 23c3 8 15 12 28 11z"/><path d="M32 34c10-6 20-8 28-11-3 8-15 12-28 11z"/><path d="M32 34C24 26 21 16 22 9c7 4 11 14 10 25z"/><path d="M32 34c8-8 11-18 10-25-7 4-11 14-10 25z"/><path d="M32 34c-4-10-4-22 0-31 4 9 4 21 0 31z"/></g></svg><span class="name">老陳的原始佛學指南<small class="name-sub">理性修佛篇</small></span></a>

</div>

</div>

<div id="lb" role="dialog" aria-label="圖片放大"><div class="lb-bar"><span>雙指可縮放；橫放手機看得更清楚</span><button type="button" id="lbzoom">原尺寸</button><button type="button" id="lbclose">關閉</button></div><div class="lb-view"><img alt=""></div></div>
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };

  function cnNum(s) { var d = '一二三四五六七八九'; if (s === '十') return 10; var i = s.indexOf('十'); if (i < 0) return d.indexOf(s) + 1; return (i === 0 ? 1 : d.indexOf(s[0]) + 1) * 10 + (s[i + 1] ? d.indexOf(s[i + 1]) + 1 : 0); }
  var LOTUS_BIG = '<svg class="cover-lotus" viewBox="0 0 64 40" aria-hidden="true"><g fill="rgba(242,196,109,.25)" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M32 34C22 28 12 26 4 23c3 8 15 12 28 11z"/><path d="M32 34c10-6 20-8 28-11-3 8-15 12-28 11z"/><path d="M32 34C24 26 21 16 22 9c7 4 11 14 10 25z"/><path d="M32 34c8-8 11-18 10-25-7 4-11 14-10 25z"/><path d="M32 34c-4-10-4-22 0-31 4 9 4 21 0 31z"/></g></svg>';
  var main = $('#main'), toc = $('#toc'), scrim = $('#scrim'), tocbtn = $('#tocbtn');
  var chapters = [], secs = [], ids = [], curCh = null, heads = [], lastHead = null, glossary = [], drills = {}, diagrams = {};
  var CN = '一二三四五六七八九十';
  // 經文出處只顯示經號文字，不連到外部網站

  // ===== 版本自動更新：每次打開／切回頁面都檢查 version.json，有新版就自動重新載入 =====
  var APP_VER = '20261117-0301';
  // ---------- 訪客統計（GoatCounter：不用 cookie、不需同意視窗）----------

  function track(path, title, isEvent) {

  }
  function bust(u) { return u + (u.indexOf('?') < 0 ? '?' : '&') + 'v=' + APP_VER; }

  }

  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') checkUpdate(); });

  function getJSON(u) { return fetch(bust(u), { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(u); return r.json(); }); }
  function getText(u) { return fetch(bust(u), { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(u); return r.text(); }); }

  Promise.all([getJSON('content/chapters.json'), getJSON('content/glossary.json'), getJSON('content/drills.json'), getJSON('content/diagrams.json'), getJSON('content/qa.json').catch(function () { return { qa: [] }; }), getJSON('content/books.json').catch(function () { return { books: [] }; })])
    .then(function (r) {

    })
    .then(build)
    .catch(function () { $('#loadmsg').textContent = '內容載入失敗，請重新整理頁面再試一次。'; });

  // ---------- 組裝 ----------
  function build(htmls) {
    main.innerHTML = '';
    var tabsHtml = '', tocHtml = '';
    chapters.forEach(function (c, i) {
      var sec = document.createElement('section');
      sec.className = 'chapter'; sec.setAttribute('data-ch', c.id); sec.hidden = true;
      sec.innerHTML = htmls[i];

      var sub = '';

      sec.insertAdjacentHTML('beforeend', '<div class="done"><svg viewBox="0 0 84 60" aria-hidden="true"><path class="pt p2" d="M42 56 C20 50 10 34 14 22 C28 26 38 40 42 56 Z" fill="#e8a8b8"/><path class="pt p2" d="M42 56 C64 50 74 34 70 22 C56 26 46 40 42 56 Z" fill="#e8a8b8"/><path class="pt p3" d="M42 56 C30 42 32 18 42 4 C52 18 54 42 42 56 Z" fill="#f6c6d2"/><path class="pt" d="M8 56 Q42 46 76 56" stroke="#9cd68c" stroke-width="3" fill="none"/></svg><span>這一章讀完了</span></div>' + deepBox(c.id) + readingBox(c.id) + shareBox(c) + printBox(c.id) + feedbackBox(c.label + (c.short && c.short !== c.label ? ' ' + c.short : '')) + chapnav(i));
      main.appendChild(sec);
      if (c.part && (i === 0 || chapters[i - 1].part !== c.part)) {
        tocHtml += '<li class="toc-part">' + c.part + '</li>';
      }
      tabsHtml += '<a class="tab" href="#' + c.id + '" data-ch="' + c.id + '" data-part="' + (c.part || '') + '"><small>' + c.label + '</small><b>' + (c.short || c.label) + '</b></a>';
      tocHtml += '<li><a class="tc" href="#' + c.id + '"><span>' + c.label + '</span>' + c.title + '</a><ol>' + sub + '</ol></li>';
    });
    var home = document.createElement('section');
    home.className = 'chapter home'; home.setAttribute('data-ch', 'home'); home.hidden = true;
    var hh = '<div class="cover">' + LOTUS_BIG + '<h1 id="home">老陳的原始佛學指南<span class="cover-sub2">理性修佛篇</span></h1><p class="cover-sub">以原始佛學為起點，用現代科學檢驗，在生活中驗證</p>' +
      '<div class="cover-act"><a class="btn pri" href="#' + chapters[0].id + '">從導論開始讀</a><span id="resume"></span><a class="btn" href="#dict">名詞辭典與入門問答</a></div><p class="offline-tip">想沒網路時也能讀？用手機瀏覽器的「分享」→「加入主畫面」，看過的章節就會存在手機裡。也可以<a href="pdf/book.pdf" target="_blank" rel="noopener">下載全書 PDF</a>。</p></div>';
    var parts = [];
    chapters.forEach(function (c) { if (parts.indexOf(c.part) < 0) parts.push(c.part); });
    var DESC = { '入門篇': '一張完整的原始佛法地圖：從四聖諦到五蓋，打好地基。', '實修篇': '把四念住、八正道、五蘊、十八界拆開來一步步練。', '解脫篇': '這條路通向哪裡？佛陀不回答的問題、修行的里程碑與涅槃。', '延伸篇': '對照後期經典與現代心理學，再把原始佛法用在情緒內耗、愛情與婚姻上。', '進階篇': '給想深入的人：重量級主題的完整長文，有故事、經典、案例和練習。' };
    parts.forEach(function (pt) {
      hh += '<div class="home-part"><h2>' + pt + '</h2>' + (DESC[pt] ? '<p class="home-desc">' + DESC[pt] + '</p>' : '') + '<div class="home-grid">';
      chapters.filter(function (c) { return c.part === pt; }).forEach(function (c) {
        hh += '<a class="home-card" href="#' + c.id + '"><span>' + c.label + '</span><b>' + c.title.split('：')[0] + '</b><i>' + (c.title.split('：')[1] || '') + '</i></a>';

    main.insertBefore(home, main.firstChild);
    var partsHtml = '<a class="part-btn home-btn" href="#home" data-p="home">首頁</a>';
    parts.forEach(function (pt) { partsHtml += '<button type="button" class="part-btn" data-p="' + pt + '">' + pt + '</button>'; });
    partsHtml += '<a class="part-btn dict-btn" href="#dict" data-p="dict">辭典</a>';
    $('#parts').innerHTML = partsHtml;
    $('#parts').addEventListener('click', function (e) { var b = e.target.closest('button.part-btn'); if (b) showPart(b.getAttribute('data-p')); });
    main.insertAdjacentHTML('beforeend', '<footer>老陳的原始佛學指南：理性修佛篇 · 左右滑動可切換章節 · 圖解可直接點選跳轉<br><span class="lic">本站內容採 <a href="https://creativecommons.org/licenses/by/4.0/deed.zh-hant" target="_blank" rel="noopener">CC BY 4.0</a> 授權，歡迎自由連結、轉載、分享，請註明出處「老陳的原始佛學指南」。法布施，不收費。</span></footer>');
    tabsHtml += '<a class="tab dtab" href="#dict-1" data-ch="dict-1" data-part="辭典"><small>一</small><b>名詞辭典</b></a><a class="tab dtab" href="#dict-2" data-ch="dict-2" data-part="辭典"><small>二</small><b>入門問答</b></a><a class="tab dtab" href="#dict-3" data-ch="dict-3" data-part="辭典"><small>三</small><b>推薦閱讀</b></a>';
    $('#tabs').innerHTML = tabsHtml; $('#toclist').innerHTML = tocHtml;
    secs = $$('.chapter'); ids = secs.map(function (s) { return s.getAttribute('data-ch'); });
    $$('.dgm').forEach(renderDiagram);
    var dict = buildDict(); main.insertBefore(dict, main.querySelector('footer'));
    tocHtml += '<li class="toc-part">工具</li><li><a class="tc" href="#dict"><span>辭典</span>名詞辭典與入門問答</a><ol><li><a href="#dict-1">一、名詞辭典</a></li><li><a href="#dict-2">二、入門問答</a></li><li><a href="#dict-3">三、推薦閱讀</a></li></ol></li>';
    $('#toclist').innerHTML = tocHtml;
    secs = $$('.chapter'); ids = secs.map(function (s) { return s.getAttribute('data-ch'); });

    fillDict(dict);
    $$('.drill').forEach(renderDrill);
    route();
    if (/printall/.test(location.search)) { secs.forEach(function (x) { x.hidden = x.classList.contains('home') || x.getAttribute('data-ch') === 'dict'; }); }
  }

  function chapnav(i) {
    var p = chapters[i - 1], n = chapters[i + 1];
    return '<nav class="chapnav">' +
      (p ? '<a class="prev" href="#' + p.id + '"><small>上一章</small>' + p.label + '</a>' : '<span></span>') +
      (n ? '<a class="next" href="#' + n.id + '"><small>下一章</small>' + n.label + '：' + n.title + '</a>'
         : '<a class="next" href="#' + chapters[0].id + '"><small>讀完了</small>回到' + chapters[0].label + '</a>') +
      '</nav>';
  }


  // ---------- 小標籤：把「核心內涵：」這類開頭變成醒目的標籤 ----------
  var ICON = {
    book: '<svg viewBox="0 0 24 24"><path d="M4 5c3-1.5 6-1.5 8 0v14c-2-1.5-5-1.5-8 0zM20 5c-3-1.5-6-1.5-8 0v14c2-1.5 5-1.5 8 0z"/></svg>',
    bulb: '<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
    tool: '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',
    scene: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>',
    shield: '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/></svg>',
    ask: '<svg viewBox="0 0 24 24"><path d="M9 9a3 3 0 1 1 4.5 2.6c-1 .6-1.5 1.2-1.5 2.4M12 18h.01"/></svg>',
    swap: '<svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>',
    warn: '<svg viewBox="0 0 24 24"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></svg>'
  };
  var LAB = {
    '原意': ['book', 'gold'], '原意與內涵': ['book', 'gold'], '核心內涵': ['book', 'gold'], '含義': ['book', 'gold'], '作用': ['book', 'gold'],
    '現代理解': ['bulb', 'cyan'], '現代應用': ['tool', 'cyan'], '日常落實': ['tool', 'cyan'], '核心作法': ['tool', 'cyan'],
    '情境': ['scene', 'muted'], '表現': ['scene', 'muted'], '舉個日常例子': ['scene', 'muted'], '比喻': ['swap', 'muted'],
    '相承': ['book', 'gold'], '發展': ['bulb', 'cyan'], '對治': ['shield', 'gold'], '結果': ['tool', 'cyan'], '提問': ['ask', 'cyan']
  };
  function labelOf(txt) {
    var m = /^\s*([^：\s，。]{1,8})：\s*/.exec(txt || ''); if (!m) return null;
    var k = m[1];
    if (LAB[k]) return { k: k, len: m[0].length, icon: LAB[k][0], tone: LAB[k][1] };
    if (/^第[一二三四五六七八九十]步$/.test(k)) return { k: k, len: m[0].length, step: true, tone: 'cyan' };
    if (/^(誤解|卡關)[一二三四五六]?$/.test(k)) return { k: k, len: m[0].length, icon: 'warn', tone: k[0] === '誤' ? 'red' : 'muted' };
    return { k: k, len: m[0].length, generic: true, tone: 'cyan' };
  }
  function firstText(el) {
    var n = el.firstChild;
    while (n && n.nodeType === 1 && (n.tagName === 'P' || n.tagName === 'STRONG')) n = n.firstChild;
    while (n && n.nodeType === 3 && !n.nodeValue.trim() && n.nextSibling) n = n.nextSibling;
    return n && n.nodeType === 3 ? n : null;
  }
  function badge(L) {
    var b = document.createElement('span'); b.className = 'lab-badge t-' + L.tone;
    b.innerHTML = (L.step ? '<b class="lab-num">' + cnNum(L.k.slice(1, -1)) + '</b>' : (L.icon ? ICON[L.icon] : '')) + L.k;
    return b;
  }
  function labelize(sec) {
    // 清單項目：已知標籤一律套用；其他「名詞：說明」只有在同一清單有兩項以上時才套用
    $$('ul, ol', sec).forEach(function (list) {
      if (list.closest('.dgm, .drill, aside, nav')) return;
      var items = [].slice.call(list.children).filter(function (li) { return li.tagName === 'LI'; });
      var found = items.map(function (li) { var t = firstText(li); return t ? labelOf(t.nodeValue) : null; });
      var n = found.filter(Boolean).length;
      items.forEach(function (li, i) {
        var L = found[i]; if (!L || (L.generic && n < 2)) return;
        var t = firstText(li); t.nodeValue = t.nodeValue.slice(L.len);
        var holder = li.firstElementChild && li.firstElementChild.tagName === 'P' ? li.firstElementChild : li;
        var strong = t.parentNode.tagName === 'STRONG' && !t.parentNode.textContent.trim() ? t.parentNode : null;
        if (strong) strong.remove();
        li.insertBefore(badge(L), li.firstChild);
        li.classList.add('lab', 't-' + L.tone); list.classList.add('lab-list');
      });
    });
    // 段落開頭的「誤解一：」「卡關：」
    $$('p', sec).forEach(function (p) {
      if (p.closest('li, .dgm, .drill')) return;
      var s = p.firstElementChild; if (!s || s.tagName !== 'STRONG' || p.firstChild !== s) return;
      var t = s.firstChild; if (!t || t.nodeType !== 3) return;
      var L = labelOf(t.nodeValue); if (!L || L.generic) return;
      t.nodeValue = t.nodeValue.slice(L.len);
      p.insertBefore(badge(L), p.firstChild); p.classList.add('lab-p', 't-' + L.tone);
    });
  }

    var term = t.closest('.term');
    if (term) { openSheet(+term.getAttribute('data-g')); return; }
    if (t.closest('#shclose')) { closeSheet(); return; }
    var jump = t.closest('a.xref, a.rd-b, #sheet a[data-jump]');
    if (jump) { rememberSpot(); closeSheet(); return; }
    if (sheet.classList.contains('open') && !t.closest('#sheet')) closeSheet();
    var f = t.closest('figure');
    if (f && !f.classList.contains('mini')) { var im = $('img', f); lbimg.src = im.src; lbimg.alt = im.alt; lb.classList.remove('big'); lb.classList.add('open'); }
  });

  // ---------- 目錄抽屜 ----------
  function setOpen(o) { toc.classList.toggle('open', o); scrim.classList.toggle('open', o); tocbtn.setAttribute('aria-expanded', o ? 'true' : 'false'); }
  tocbtn.addEventListener('click', function () { setOpen(!toc.classList.contains('open')); });
  scrim.addEventListener('click', function () { setOpen(false); });
  toc.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });

  function showPart(pt, mark) {
    $$('.part-btn').forEach(function (b) { var p = b.getAttribute('data-p'); b.classList.toggle('on', mark ? p === mark : p === pt); });
    $$('.tab').forEach(function (a) { a.hidden = a.getAttribute('data-part') !== pt; });
    var pb = $('.part-btn.on'), pr = $('#parts'); if (pb && pr) pr.scrollLeft = pb.offsetLeft - pr.clientWidth / 2 + pb.offsetWidth / 2;
    var t = $('#tabs'), changed = pt !== curPart; curPart = pt;
    if (t && changed) t.scrollLeft = 0;
    centerTab();
  }
  var curPart = null;
  function centerTab() {
    function go() {
      var t = $('#tabs'), on = $('.tab.on:not([hidden])'), pr = $('#parts'), pb = $('.part-btn.on');
      if (t && on) t.scrollLeft = on.offsetLeft - t.clientWidth / 2 + on.offsetWidth / 2;
      if (pr && pb) pr.scrollLeft = pb.offsetLeft - pr.clientWidth / 2 + pb.offsetWidth / 2;
    }
    go(); requestAnimationFrame(go); setTimeout(go, 350);
  }
  // ---------- 路由（網址 #章節）----------
  function showChapter(ch) {
    if (ch === curCh) return;
    if (ch === 'dict' && curCh) { if (!(searchReturnTo && curCh === searchReturnTo)) clearDictSearch(); searchReturnTo = null; }
    else if (curCh === 'dict' && ch !== searchReturnTo) searchReturnTo = null;
    var sec = secs[ids.indexOf(ch)];
    secs.forEach(function (s) { s.hidden = (s !== sec); });
    var cpart = chapterOf(ch) ? chapterOf(ch).part : chapters[0].part;
    showPart(ch === 'dict' ? '辭典' : cpart, (ch === 'home' || ch === 'dict') ? ch : null);
    $$('.tab').forEach(function (a) {
      var on = a.getAttribute('data-ch') === ch; a.classList.toggle('on', on);
    });
    centerTab();
    heads = $$(':scope > h1, :scope > h2', sec); curCh = ch; lastHead = null;
    var tc = chapterOf(ch); document.title = tc ? tc.label + '・' + (tc.short || tc.title) + '｜老陳的原始佛學指南' : (ch === 'dict' ? '名詞辭典與入門問答｜老陳的原始佛學指南' : '老陳的原始佛學指南：理性修佛篇');
    track('/' + ch, document.title);
    var cc = chapterOf(ch); $('#where').textContent = cc ? cc.label : (ch === 'dict' ? '辭典' : '');
    if (cc) { try { localStorage.setItem('lastCh', ch); } catch (e) {} }
    if (ch === 'home') {
      var last = null; try { last = localStorage.getItem('lastCh'); } catch (e) {}
      var lc = last && chapterOf(last);
      $('#resume').innerHTML = lc ? '<a class="btn" href="#' + lc.id + '">繼續閱讀：' + lc.label + '</a>' : '';
    }
  }
  // ---------- 小標題金線、讀完蓮花 ----------
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -12% 0px' }) : null;
  if (!io) document.documentElement.classList.add('noio');
  function watchFx(sec) { if (io) $$('h2, .done', sec).forEach(function (el) { if (!el.classList.contains('in')) io.observe(el); }); }
  function shineTitle(sec) { var h = sec && sec.querySelector(':scope > h1'); if (!h) return; h.classList.remove('shine'); void h.offsetWidth; h.classList.add('shine'); }
  function route() {
    var h = decodeURIComponent((location.hash || '').slice(1));
    var target = h ? document.getElementById(h) : null;
    var sec = target ? target.closest('.chapter') : null;
    if (!sec) sec = secs[0];
    showChapter(sec.getAttribute('data-ch'));
    watchFx(sec); shineTitle(sec);
    if (pendingY !== null) { window.scrollTo(0, pendingY); pendingY = null; }
    else if (target && target.tagName === 'H2') target.scrollIntoView(); else window.scrollTo(0, 0);
    if (pendingFind && pendingFind.ch === sec.getAttribute('data-ch')) setTimeout(function () { doFind(sec); }, 80);
    onScroll();
  }
  var bar = $('#bar'), tocLinks = {};
  function onScroll() {
    var y = window.scrollY, hh = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (hh > 0 ? Math.min(100, y / hh * 100) : 0) + '%';
    var cur = null;
    var tb = document.querySelector('.topbar'), lim = (tb ? tb.getBoundingClientRect().bottom : 110) + 40;
    for (var i = 0; i < heads.length; i++) { if (heads[i].getBoundingClientRect().top < lim) cur = heads[i]; else break; }
    if (curCh === 'dict') { var did = cur && /^dict-\d/.test(cur.id) ? cur.id : 'dict-1'; $$('.dtab').forEach(function (d) { d.classList.toggle('on', d.getAttribute('data-ch') === did); }); }
    if (cur !== lastHead) {
      $$('#toc a.here').forEach(function (a) { a.classList.remove('here'); });
      if (cur) { var a = $('#toc a[href="#' + cur.id + '"]'); if (a) a.classList.add('here'); }
      lastHead = cur;
    }
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a, button'); if (!a) return;
    var h = a.getAttribute('href') || '', m = h.match(/^pdf\/([^?]+)\.pdf/);
    if (m) return track('下載PDF-' + m[1], '下載 PDF：' + m[1], true);
    if (a.classList.contains('share-go')) return track('分享-系統-' + curCh, '分享（系統）', true);
    if (a.classList.contains('share-line')) return track('分享-LINE-' + curCh, '分享（LINE）', true);
    if (a.classList.contains('share-copy')) return track('分享-複製-' + curCh, '分享（複製連結）', true);
  }, true);
  window.addEventListener('hashchange', route);
  window.addEventListener('scroll', onScroll, { passive: true });

  // ---------- 左右滑動換章 ----------
  var sx = null, sy = 0, st = 0;
  main.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1 || e.target.closest('.drill')) { sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
  }, { passive: true });
  main.addEventListener('touchend', function (e) {
    if (sx === null || lb.classList.contains('open') || sheet.classList.contains('open')) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 90 && Math.abs(dy) < 50 && Date.now() - st < 700) {
      if (curCh === 'dict') return;
      var i = ids.indexOf(curCh) + (dx < 0 ? 1 : -1);
      if (i >= 0 && i < ids.length && ids[i] !== 'dict') location.hash = ids[i];
    }
  }, { passive: true });

  // ---------- 圖片放大 ----------
  var lb = $('#lb'), lbimg = $('img', lb);
  $('#lbclose').addEventListener('click', function () { lb.classList.remove('open'); });
  $('#lbzoom').addEventListener('click', function () { lb.classList.toggle('big'); this.textContent = lb.classList.contains('big') ? '符合螢幕' : '原尺寸'; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { lb.classList.remove('open'); closeSheet(); } });

  // ---------- 圖解繪製 ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function tone(t, def) { return ' t-' + (t || def || 'cyan'); }
  function card(it, def, cls) {
    var tag = it.href ? 'a' : 'div', href = it.href ? ' href="' + esc(it.href) + '"' : '';
    var h = '<' + tag + href + ' class="g-card' + tone(it.tone, def) + (cls ? ' ' + cls : '') + '">';
    if (it.badge) h += '<span class="g-badge">' + esc(it.badge) + '</span>';
    if (it.k) h += '<span class="g-k">' + esc(it.k) + '</span>';
    if (it.h) h += '<b class="g-h">' + esc(it.h) + '</b>';
    if (it.en) h += '<i class="g-en">' + esc(it.en) + '</i>';
    if (it.s) h += '<span class="g-s">' + esc(it.s) + '</span>';
    if (it.d) h += '<span class="g-d">' + esc(it.d) + '</span>';
    if (it.lines) h += '<span class="g-lines">' + it.lines.map(function (l) { return '<span>' + esc(l) + '</span>'; }).join('') + '</span>';
    if (it.seq) h += '<span class="g-seq">' + it.seq.map(function (l) { return '<span>' + esc(l) + '</span>'; }).join('<em>↓</em>') + '</span>';
    if (it.use) h += '<span class="g-use"><small>' + esc(it._ul || '用法') + '</small>' + esc(it.use) + '</span>';
    return h + '</' + tag + '>';
  }
  function suttaHref() { return null; }
  var BLOCK = {
    cmp: function (b) {
      return '<div class="g-cmp">' + card(b.from, 'muted') +
        '<div class="g-via"><span class="g-arrow">➜</span>' + (b.via ? '<b>' + esc(b.via) + '</b>' : '') + (b.vianote ? '<small>' + esc(b.vianote) + '</small>' : '') + '</div>' +
        card(b.to, 'gold') + '</div>';
    },
    cols: function (b) {
      return '<div class="g-cols' + (b.plus ? ' g-plus' : '') + '">' + b.items.map(function (it) { return card(it, b.tone || 'cyan'); }).join(b.plus ? '<span class="g-plusmark">＋</span>' : '') + '</div>';
    },
    grid: function (b) {
      return '<div class="g-grid n' + b.items.length + '">' + b.items.map(function (it) { it._ul = b.uselabel; return card(it, b.tone || 'cyan', it.badge ? 'has-badge' : ''); }).join('') + '</div>';
    },
    steps: function (b) {
      return '<div class="g-steps n' + b.items.length + '">' + b.items.map(function (it) { return card(it, b.tone || 'cyan'); }).join('<span class="g-step-arrow" aria-hidden="true"></span>') + '</div>';
    },
    map: function (b) {
      return '<div class="g-map">' + b.items.map(function (it) {
        return '<div class="g-maprow">' + card(it, 'cyan') + '<span class="g-step-arrow" aria-hidden="true"></span><div class="g-card t-gold g-mapto"><b class="g-h">' + esc(it.to) + '</b></div></div>';
      }).join('') + '</div>';
    },
    vflow: function (b) {
      return '<div class="g-vflow">' + b.items.map(function (it) { return card(it, b.tone || 'cyan', 'g-row'); }).join('<span class="g-down" aria-hidden="true">▼</span>') + '</div>';
    },
    hub: function (b) {
      var c = '<div class="g-hubc"><b>' + esc(b.center.h) + '</b><span>' + esc(b.center.d) + '</span></div>';
      var items = '<div class="g-hubitems">' + b.items.map(function (it) { return card(it, 'cyan'); }).join('') + '</div>';
      return '<div class="g-hub">' + (b.down ? c + '<span class="g-down">▼</span>' + items : items + '<span class="g-down">▼</span>' + c) + '</div>';
    },
    cycle: function (b) {
      return '<div class="g-cycle"><div class="g-hubc"><b>' + esc(b.center.h) + '</b><span>' + esc(b.center.d) + '</span></div><ol class="g-cyc">' +
        b.items.map(function (it) { return '<li>' + card(it, 'gold') + '</li>'; }).join('') + '</ol><div class="g-back">↻ 回到起點，不斷循環</div></div>';
    },
    chain: function (b) {
      return '<div class="g-chain">' + b.items.map(function (x, i) { return '<span class="g-chip' + (b.hl.indexOf(i) >= 0 ? ' t-gold' : ' t-cyan') + '">' + esc(x) + '</span>'; }).join('<span class="g-sep">→</span>') + '</div>';
    },
    pairs: function (b) {
      return '<div class="g-pairs">' + b.items.map(function (p) { return '<div class="g-pair"><span class="g-chip t-cyan">' + esc(p[0]) + '</span><span class="g-sep">→</span><span class="g-chip t-gold">' + esc(p[1]) + '</span></div>'; }).join('') + '</div>';
    },
    triples: function (b) {
      var head = '<div class="g-trow g-thead">' + b.heads.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>';
      return '<div class="g-triples">' + head + b.items.map(function (r) { return '<div class="g-trow"><span class="g-chip t-cyan">' + esc(r[0]) + '</span><span class="g-chip t-gold">' + esc(r[1]) + '</span><span class="g-chip t-muted">' + esc(r[2]) + '</span></div>'; }).join('') + '</div>';
    },
    chips: function (b) {
      return '<div class="g-gates">' + b.items.map(function (x) { return '<div class="g-gate"><span class="g-chip t-cyan">' + esc(x) + '</span><span class="g-guard">' + esc(b.tag) + '</span></div>'; }).join('') + '</div>';
    },
    dots: function (b) {
      return '<ol class="g-dots">' + b.items.map(function (it) { return '<li><span class="g-dot">' + esc(it.badge) + '</span><div><b>' + esc(it.h) + '</b>' + (it.d ? '<span>' + esc(it.d) + '</span>' : '') + '</div></li>'; }).join('') + '</ol>';
    },
    checks: function (b) {
      return '<ul class="g-checks">' + b.items.map(function (it) { return '<li><span class="g-box" aria-hidden="true"></span><div><b>' + esc(it.h) + '</b><span>' + esc(it.d) + '</span></div></li>'; }).join('') + '</ul>';
    },
    box: function (b) { return card(b, b.tone || 'gold', 'g-boxed'); },
    banner: function (b) { return '<div class="g-banner' + tone(b.tone, 'cyan') + '">' + esc(b.text) + '</div>'; },
    label: function (b) { return '<div class="g-label' + tone(b.tone, 'cyan') + '">' + esc(b.text) + '</div>'; },
    note: function (b) {
      var u = suttaHref(b.sutta), t = esc(b.text);
      return '<div class="g-note' + tone(b.tone, 'gold') + '">' + (u ? '<a class="sutta" href="' + u + '" target="_blank" rel="noopener">' + t + '</a>' : t) + '</div>';
    },
    small: function (b) { return '<div class="g-small">' + esc(b.text) + '</div>'; },
    quote: function (b) { return '<blockquote class="g-quote">' + esc(b.text) + '</blockquote>'; },
    next: function (b) { return '<a class="g-next" href="' + esc(b.href) + '">' + esc(b.text) + '<span aria-hidden="true">→</span></a>'; },
    lotus: function (b) {
      return '<div class="g-lotus"><svg viewBox="0 0 200 120" aria-hidden="true"><g fill="rgba(242,196,109,.22)" stroke="#f2c46d" stroke-width="2">' +
        '<path d="M100 95 C70 75 40 70 20 62 C30 85 65 98 100 95Z"/><path d="M100 95 C130 75 160 70 180 62 C170 85 135 98 100 95Z"/>' +
        '<path d="M100 95 C78 70 70 45 72 30 C92 42 104 70 100 95Z"/><path d="M100 95 C122 70 130 45 128 30 C108 42 96 70 100 95Z"/>' +
        '<path d="M100 95 C88 65 88 30 100 8 C112 30 112 65 100 95Z"/></g><circle cx="100" cy="62" r="5" fill="#fff"/>' +
        '<path d="M40 108 Q100 118 160 108" stroke="#f2c46d" stroke-width="2" fill="none"/></svg>' +
        '<b>' + esc(b.h) + '</b><span>' + esc(b.d) + '</span></div>';
    }
  };
  function renderDiagram(box) {
    var d = diagrams[box.getAttribute('data-dg')]; if (!d) return;
    var u = suttaHref(d.sutta), h = '';
    var src = (d.sub || '').split('　').filter(function (x) { return /[《〈]|阿含/.test(x); }).join('');
    d.blocks.forEach(function (b) { if (BLOCK[b.t]) h += BLOCK[b.t](b); });
    if (src) h += '<div class="g-src">出處：' + (u ? '<a class="sutta" href="' + u + '" target="_blank" rel="noopener">' + esc(src) + '</a>' : esc(src)) + '</div>';
    box.innerHTML = h;
    box.setAttribute('role', 'figure'); box.setAttribute('aria-label', '圖解：' + d.title);
  }

  // ---------- 互動演練 ----------
  var FEEL = { '樂': '樂受（舒服）', '苦': '苦受（不舒服）', '捨': '捨受（不苦不樂）' };
  function renderChoice(box, d) {
    var si = 0;
    function draw(pick) {
      var sc = d.scenarios[si], h = '<h4>' + esc(d.title) + '</h4><p class="d-intro">' + esc(d.intro) + '</p>';
      if (d.scenarios.length > 1) {
        h += '<div class="d-scen">';
        d.scenarios.forEach(function (s, i) { h += '<button type="button" class="btn' + (i === si ? ' on' : '') + '" data-sc="' + i + '">' + esc(s.name) + '</button>'; });
        h += '</div>';
      }
      h += '<div class="d-step"><b class="k">情境</b>' + esc(sc.situation) + '</div><div class="d-q">' + esc(sc.question) + '</div><div class="d-opts">';
      sc.options.forEach(function (o, i) {
        var cls = 'btn';
        if (pick != null && i === pick) cls += o.ok ? ' right' : ' wrong';
        h += '<button type="button" class="' + cls + '" data-op="' + i + '">' + esc(o.label) + '</button>';
      });
      h += '</div>';
      if (pick != null) {
        var o = sc.options[pick];
        h += '<div class="d-step ' + (o.ok ? 'good' : 'bad') + '"><b class="k">' + (o.ok ? '✓ 這樣做' : '再想想') + '</b>' + esc(o.feedback) + '</div>';
        if (o.ok && si < d.scenarios.length - 1) h += '<div class="d-again"><button type="button" class="btn pri" data-sc="' + (si + 1) + '">下一個情境</button></div>';
      }
      box.innerHTML = h;
    }
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-sc')) { si = +b.getAttribute('data-sc'); draw(null); return; }
      if (b.hasAttribute('data-op')) draw(+b.getAttribute('data-op'));
    });
    draw(null);
  }
  function renderDrill(box) {
    var d = drills[box.getAttribute('data-drill')]; if (!d) return;
    if (d.type === 'choice') { renderChoice(box, d); return; }
    var si = 0;
    function chain(state) {
      var steps = ['觸', '受', '愛', '取', '有', '苦'], out = '';
      steps.forEach(function (k, i) {
        var cls = 'd-node';
        if (i < state.lit) cls += (state.bad && i >= 2) ? ' hot' : ' lit';
        if (state.cut && i >= 2) cls += ' cut';
        out += '<span class="' + cls + '">' + k + '</span>';
        if (i < steps.length - 1) out += (state.cut && i === 1) ? '<span class="d-sep scissor" aria-label="在這裡切斷">✂</span>' : '<span class="d-sep">→</span>';
      });
      return '<div class="d-chain" aria-hidden="true">' + out + '</div>';
    }
    function draw(stage, extra) {
      var sc = d.scenarios[si], h = '<h4>' + d.title + '</h4><p class="d-intro">' + d.intro + '</p><div class="d-scen">';
      d.scenarios.forEach(function (s, i) { h += '<button type="button" class="btn' + (i === si ? ' on' : '') + '" data-sc="' + i + '">' + s.name + '</button>'; });
      h += '</div>';
      var state = { lit: 1 };
      if (stage >= 2) state.lit = 2;
      if (stage === 3) { state.lit = 6; state.bad = true; }
      if (stage === 4) { state.lit = 2; state.cut = true; }
      h += chain(state);
      h += '<div class="d-step"><b class="k">觸</b>' + sc.touch + '</div>';
      if (stage === 1) {
        h += '<div class="d-q">這一刻，生起的是哪一種受？</div><div class="d-opts">';
        ['樂', '苦', '捨'].forEach(function (k) { h += '<button type="button" class="btn" data-feel="' + k + '">' + FEEL[k] + '</button>'; });
        h += '</div>' + (extra ? '<div class="d-msg">' + extra + '</div>' : '');
      } else {
        h += '<div class="d-step"><b class="k">受</b>' + sc.feelingNote + '</div>';
      }
      if (stage === 2) {
        h += '<div class="d-q">接下來，你會怎麼做？</div><div class="d-opts">' +
          '<button type="button" class="btn" data-go="auto">' + sc.auto.label + '</button>' +
          '<button type="button" class="btn" data-go="aware">' + sc.aware.label + '</button></div>';
      }
      if (stage === 3) {
        sc.auto.chain.forEach(function (c) { h += '<div class="d-step bad"><b class="k">' + c[0] + '</b>' + c[1] + '</div>'; });
        h += '<div class="d-again"><button type="button" class="btn pri" data-go="retry">換個做法再試一次</button></div>';
      }
      if (stage === 4) {
        h += '<div class="d-step good"><b class="k">✂ 在受與愛之間踩煞車</b>' + sc.aware.result + '</div>' +
          '<div class="d-again"><button type="button" class="btn" data-go="retry">看看另一條路會怎樣</button></div>';
      }
      box.innerHTML = h;
    }
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-sc')) { si = +b.getAttribute('data-sc'); draw(1); return; }
      if (b.hasAttribute('data-feel')) {
        var k = b.getAttribute('data-feel'), sc = d.scenarios[si];
        if (k === sc.feeling) draw(2); else draw(1, '再感覺一下：這個當下，身心是舒服、不舒服，還是沒什麼感覺？');
        return;
      }
      var go = b.getAttribute('data-go');
      if (go === 'auto') draw(3); else if (go === 'aware') draw(4); else if (go === 'retry') draw(2);
    });
    draw(1);
  }
})();
</script>
